# Every 3 hours (and on every push): test, refresh the digest sources, keep their history, publish the site.
name: Digest + publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */3 * * *'   # :15 past every 3rd hour UTC — 8:45 IST, 11:45, 14:45…
  workflow_dispatch:

permissions:
  contents: write   # commit the growing digest history
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Fetch RBI Directions + word of the day
        run: python3 scripts/digest.py

      - name: Save digest history
        run: |
          if [ -n "$(git status --porcelain data/digest.json)" ]; then
            git config user.name "lifeboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/digest.json
            git commit -m "chore: refresh digest"
            git pull --rebase --autostash && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
