<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f4f1e8">
  <title>Lifeboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='2' width='26' height='26' fill='%23ffe27a' stroke='%2316130f' stroke-width='3'/><text x='15' y='23' font-family='sans-serif' font-weight='700' font-size='18' text-anchor='middle'>L</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Views and themes"></aside>
    <div class="main-col">
      <header id="topbar"></header>
      <div id="strip"></div>
      <main id="view"></main>
    </div>
    <aside id="detail" aria-label="Details"></aside>
  </div>
  <div id="scrim"></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Lifeboard needs JavaScript.</noscript>
  <script type="module">
    import { boot } from './js/app.js';
    boot();
  </script>
</body>
</html>
